<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当日のスケジュール | Wedding Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F1E3;
    --navy:#2B3A67;
    --teal:#305C6B;
    --lime:#D7F27A;
    --sky:#8FB6DA;
    --terracotta:#DB7A43;
    --ink-soft:#6B7178;
    --white:#FDFBF6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:var(--cream);
    color:var(--navy);
    font-family:"M PLUS Rounded 1c", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{ max-width:480px; margin:0 auto; padding:0 0 60px; }

  /* ---------- HERO ---------- */
  .hero{ padding:44px 28px 4px; }
  .hero h1{
    font-family:"Fredoka", sans-serif;
    font-weight:700;
    font-size:38px;
    line-height:1.12;
    color:var(--navy);
    margin:0;
  }
  .squiggle{ margin:14px 0 12px; display:block; }
  .venue{
    font-size:13.5px;
    font-weight:700;
    color:var(--teal);
    letter-spacing:.02em;
  }

  /* ---------- CARDS ---------- */
  .cards{
    padding:26px 24px 0;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .card{
    border-radius:26px;
    border:3px solid var(--lime);
    padding:22px 22px 20px;
    display:flex;
    align-items:center;
    gap:18px;
  }
  .card.teal{ background:var(--teal); }
  .card.terracotta{ background:var(--terracotta); }

  .icon-tile{
    flex:none;
    width:52px; height:52px;
    border-radius:16px;
    background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center;
  }
  .icon-tile svg{ width:26px; height:26px; }

  .info{ flex:1; }
  .time{
    font-family:"Fredoka", sans-serif;
    font-weight:700;
    font-size:26px;
    color:var(--lime);
    line-height:1;
  }
  .label{
    margin-top:6px;
    font-size:15px;
    font-weight:700;
    color:var(--white);
  }
  .note{
    margin-top:3px;
    font-size:11.5px;
    color:rgba(253,251,246,.8);
  }

  .signature{
    padding:30px 28px 0;
    text-align:center;
  }
  .signature .names-big{
    font-family:"Fredoka", sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--navy);
  }
  .signature .amp{ color:var(--terracotta); margin:0 8px; }
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <h1>Wedding<br>Schedule</h1>
    <svg class="squiggle" width="220" height="20" viewBox="0 0 220 20" fill="none">
      <path d="M2 12 Q 30 2, 58 12 T 114 12 T 170 12 T 218 10"
        stroke="var(--sky)" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <p class="venue">会場：アルカンシエル南青山（挙式・披露宴とも同会場）</p>
  </div>

  <div class="cards">

    <div class="card teal">
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--lime)" stroke-width="2">
          <path d="M3 20h18M6 20V9l6-4 6 4v11M10 20v-6h4v6"/>
        </svg>
      </div>
      <div class="info">
        <div class="time">9:30</div>
        <div class="label">受付開始</div>
        <div class="note">お時間までにお越しください</div>
      </div>
    </div>

    <div class="card terracotta">
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--lime)" stroke-width="2">
          <circle cx="8" cy="15" r="4.2"/><circle cx="16" cy="15" r="4.2"/>
        </svg>
      </div>
      <div class="info">
        <div class="time">10:00</div>
        <div class="label">挙式</div>
      </div>
    </div>

    <div class="card teal">
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--lime)" stroke-width="2">
          <path d="M7 3v6a2 2 0 002 2v10M7 6h4M17 3l-2 8h4l-2-8zM17 11v10"/>
        </svg>
      </div>
      <div class="info">
        <div class="time">10:30</div>
        <div class="label">？？？</div>
      </div>
    </div>

    <div class="card terracotta">
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--lime)" stroke-width="2">
          <path d="M4 10c0 4 3.5 8 8 8s8-4 8-8M4 10h16M4 10l1-5h14l1 5"/>
        </svg>
      </div>
      <div class="info">
        <div class="time">11:00</div>
        <div class="label">披露宴</div>
      </div>
    </div>

    <div class="card teal">
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--lime)" stroke-width="2">
          <path d="M12 20s-7-4.5-7-9.5A4.5 4.5 0 0112 8a4.5 4.5 0 017 2.5C19 15.5 12 20 12 20z"/>
        </svg>
      </div>
      <div class="info">
        <div class="time">13:30</div>
        <div class="label">結び</div>
        <div class="note"></div>
      </div>
    </div>

  </div>

  <div class="signature">
    <div class="names-big">三俣正和<span class="amp">&amp;</span>小池扶美香</div>
  </div>

</div>
</body>
</html>
